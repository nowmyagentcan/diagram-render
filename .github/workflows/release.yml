# A v* tag builds every target into a draft release with SHA256SUMS and build attestations.
# Running it by hand (workflow_dispatch) is the dry run: the same archives and smokes, no release.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  MACOSX_DEPLOYMENT_TARGET: '11.0'
jobs:
  engines:
    uses: ./.github/workflows/engines.yml
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, triple: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: macos-arm64, triple: aarch64-apple-darwin }
          - { os: macos-15-intel, target: macos-x64, triple: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: linux-x64, triple: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: linux-arm64, triple: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ !startsWith(matrix.target, 'macos') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: Sign (off until certificates exist; add the secrets, then remove the if)
        if: false
        shell: bash
        run: echo "signtool on Windows, codesign and notarytool on macOS"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.triple }}/release/diagram-render${{ runner.os == 'Windows' && '.exe' || '' }}
  package:
    needs: [engines, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - uses: actions/download-artifact@v8
        with:
          path: bin
      - name: Archive
        run: |
          v=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" = "$v" ]
          cargo about generate --locked -c scripts/about.toml scripts/about.hbs -o THIRD-PARTY-LICENSES.txt
          # A licence text cargo-about filled from a template has no real copyright line.
          if grep -nE '<(year|owner|copyright holders)>' THIRD-PARTY-LICENSES.txt; then exit 1; fi
          for t in windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64; do
            sh scripts/package.sh $t bin/$t/diagram-render* bin/engines-$t dist
          done
          # Windows starts them with no C runtime of its own to find.
          ! objdump -p bin/windows-x64/diagram-render.exe | grep -iE 'DLL Name: (vcruntime|msvcp|api-ms-win-crt)'
          for f in install.sh install.ps1; do sed "s/@VERSION@/$v/g" scripts/$f > dist/$f; done
          cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests/fixtures
          path: src
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Run the archive
        run: |
          mkdir x && cd x
          if [ ${{ matrix.target }} = windows-x64 ]; then unzip -q ../dist/*-windows-x64.zip
          else tar -xzf ../dist/*-${{ matrix.target }}.tar.gz; fi
          case $RUNNER_OS in
            Linux) file diagram-render | grep -E 'static(-pie|ally) linked' ;;
            macOS) for f in diagram-render engines/dot; do otool -l $f | grep -E 'minos 11\.0$'; done ;;
          esac
          test -s LICENSE && test -s NOTICE && test -s README.md && test -s licenses/THIRD-PARTY-LICENSES.txt
          ./diagram-render --version | grep -x 'diagram-render [0-9.]*'
          ./diagram-render formats --json | tee formats.json
          test "$(jq '[.formats[] | select(.available)] | length' formats.json)" -eq 6
      - name: Render one fixture of each format to SVG and PNG
        working-directory: x
        run: |
          f=../src/tests/fixtures
          for input in mermaid/flowchart.mmd dot/clusters.dot d2/containers.d2 bpmn/activities.bpmn \
            drawio/shapes.drawio excalidraw/shapes.excalidraw; do
            for to in svg png; do
              ./diagram-render "$f/$input" -o "out.$to" --json | tee out.json
              jq -e --arg to $to '.to == $to and .width > 0 and .height > 0' out.json
              test -s "out.$to"
            done
          done
      - name: Copy the files with wrong checksums
        run: mkdir bad && cp dist/* bad/ && sed -i.bak 's/^./x/' bad/SHA256SUMS
      # The installers are tested here, on throwaway runners, because they edit the user's PATH.
      - name: install.sh with sh, bash and zsh
        if: runner.os != 'Windows'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          if DIAGRAM_RENDER_BASE=http://127.0.0.1:8765/bad sh dist/install.sh; then exit 1; fi
          test ! -e ~/.local/bin/diagram-render
          for s in sh bash zsh; do
            command -v $s >/dev/null || continue
            DIAGRAM_RENDER_BASE=http://127.0.0.1:8765/dist $s dist/install.sh
          done
          test -L ~/.local/bin/diagram-render
          # Through the link it still finds its engines, and an upgrade replaces them while one runs.
          ~/.local/bin/diagram-render formats --json | jq -e '[.formats[] | select(.available)] | length == 6'
          ~/.local/bin/diagram-render src/tests/fixtures/dot/clusters.dot -o through-link.png
          sleep 30 | ~/.local/share/diagram-render/engines/dot >/dev/null &
          DIAGRAM_RENDER_BASE=http://127.0.0.1:8765/dist sh dist/install.sh
          ~/.local/bin/diagram-render src/tests/fixtures/dot/clusters.dot -o after-upgrade.png
          test ! -e ~/.local/share/diagram-render.new.* && test ! -e ~/.local/share/diagram-render.old.*
      - name: install.ps1 with Windows PowerShell and PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python '-m http.server 8765 --bind 127.0.0.1' -WindowStyle Hidden
          Start-Sleep 2
          $dir = "$env:LOCALAPPDATA\Programs\diagram-render"
          $env:DIAGRAM_RENDER_BASE = 'http://127.0.0.1:8765/bad'
          powershell -NoProfile -File dist/install.ps1
          if (!$LASTEXITCODE -or (Test-Path $dir)) { throw 'installed despite wrong checksums' }
          $env:DIAGRAM_RENDER_BASE = 'http://127.0.0.1:8765/dist'
          foreach ($ps in 'powershell', 'pwsh') {
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
            & $ps -NoProfile -File dist/install.ps1
            if ($LASTEXITCODE) { throw "install.ps1 failed in $ps" }
          }
          # A new shell finds it through the user PATH alone, and the engines stay off it.
          powershell -NoProfile -Command '$env:Path = [Environment]::GetEnvironmentVariable(''Path'', ''User''); diagram-render --version; if (Get-Command dot -ErrorAction SilentlyContinue) { exit 1 }'
          if ($LASTEXITCODE) { throw 'not on the user PATH, or an engine is' }
          # An upgrade while the page and an engine run.
          $ui = Start-Process "$dir\diagram-render.exe" 'ui --no-open --port 8766' -PassThru -WindowStyle Hidden
          $engine = [Diagnostics.Process]::new()
          $engine.StartInfo.FileName = "$dir\engines\dot.exe"
          $engine.StartInfo.RedirectStandardInput = $true
          $engine.StartInfo.UseShellExecute = $false
          [void]$engine.Start()
          Set-Content "$dir\notes.old" 'kept'
          powershell -NoProfile -File dist/install.ps1
          if ($LASTEXITCODE) { throw 'upgrade over a running install failed' }
          (Invoke-WebRequest http://127.0.0.1:8766/ -UseBasicParsing).StatusCode
          $engine.Kill(); $engine.WaitForExit(); Stop-Process -Id $ui.Id; $ui.WaitForExit()
          & "$dir\diagram-render.exe" src/tests/fixtures/dot/clusters.dot -o after-upgrade.png
          if ($LASTEXITCODE) { throw 'the upgraded install fails' }
          # What the running copies held goes with the next install; other files in the folder stay.
          powershell -NoProfile -File dist/install.ps1
          $left = Get-ChildItem $dir -Recurse -File | Where-Object Name -Match '\.old$' | ForEach-Object Name
          if (Compare-Object @($left) 'notes.old') { throw "left $left" }
          Remove-Item "$dir\notes.old"
          # An upgrade from an archive without the exe, or with one that doesn't run, keeps the installed one.
          $zip = (Get-Item dist/*-windows-x64.zip).Name
          $count = (Get-ChildItem $dir -Recurse -File).Count
          New-Item -ItemType Directory missing, invalid, payload | Out-Null
          Compress-Archive dist/SHA256SUMS "missing/$zip"
          [IO.File]::WriteAllBytes("$PWD/payload/diagram-render.exe", [byte[]](0, 1, 2, 3))
          Compress-Archive payload/diagram-render.exe "invalid/$zip"
          foreach ($case in 'missing', 'invalid') {
            "$((Get-FileHash "$case/$zip").Hash)  $zip" | Set-Content "$case/SHA256SUMS"
            $env:DIAGRAM_RENDER_BASE = "http://127.0.0.1:8765/$case"
            powershell -NoProfile -File dist/install.ps1
            if (!$LASTEXITCODE -or (Get-ChildItem $dir -Recurse -File).Count -ne $count) { throw "a failed upgrade ($case) changed the install" }
            & "$dir\diagram-render.exe" --version
            if ($LASTEXITCODE) { throw "diagram-render.exe doesn't run after the $case upgrade" }
          }
  release:
    if: github.ref_type == 'tag'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
