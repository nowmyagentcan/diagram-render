name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  engines:
    uses: ./.github/workflows/engines.yml
  test:
    needs: engines
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/download-artifact@v8
        with:
          name: engines-${{ matrix.target }}
          path: target/debug
      - if: runner.os != 'Windows'
        run: chmod +x target/debug/engines/*
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses
      - name: engines.lock pins exactly merman 0.9.3, d2 0.9.0, Graphviz 16.1.0, expat 2.10.0 and Liberation 2.1.5
        run: |
          got=$(awk '!/^#/ { sub(/-(crate|notices)$/, "", $1); print $1, $2 }' scripts/engines.lock | sort -u | paste -sd,)
          test "$got" = "d2 0.9.0,expat 2.10.0,graphviz 16.1.0,liberation 2.1.5,merman 0.9.3"
