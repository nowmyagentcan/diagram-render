[package]
name = "diagram-render"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Render Mermaid, Graphviz DOT, D2, BPMN, draw.io and Excalidraw diagrams to SVG or PNG, offline"
repository = "https://github.com/nowmyagentcan/diagram-render"
publish = false

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
lexopt = "0.3.2"
png = "0.18.1"
quick-xml = "0.42.0"
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
roxmltree = "0.21.2"
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
wuff = { version = "0.2.9", default-features = false, features = ["brotli"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console"] }
