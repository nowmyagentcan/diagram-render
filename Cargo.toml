[package]
name = "diagram-render"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Render Mermaid, Graphviz DOT, D2, BPMN, draw.io and Excalidraw diagrams to SVG or PNG on your own computer"
repository = "https://github.com/nowmyagentcan/diagram-render"
publish = false

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
imagesize = "0.15.0"
lexopt = "0.3.2"
percent-encoding = "2.3.2"
png = "0.18.1"
quick-xml = "0.42.0"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
roxmltree = "0.21.2"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["rt"] }
wuff = { version = "0.2.9", default-features = false, features = ["brotli"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
